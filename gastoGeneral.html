<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vista General de Gastos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f6f8;
    }
 
  body {
    background: linear-gradient(0deg, rgba(251,251,251,0) 34%, rgba(45,101,253,1) 77%);
    font-family: Arial, sans-serif;
  }

    h2 { text-align: center; }
    h2 { text-align: center; }

    .filtros {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .filtros input, .filtros select {
      padding: 6px;
      width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }

    tr:hover {
      background-color: #f1f7ff;
    }

    button {
      padding: 5px 10px;
      margin: 2px;
    }

    .modal {
  position: fixed;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(15, 15, 15, 0.281);
}
.modal-content {
  background-color: #1111116e;
  margin: 10% auto;
  padding: 20px;
  width: 90%;
  max-width: 500px;
  border-radius: 8px;
}
.close {
  float: right;
  font-size: 24px;
  cursor: pointer;
}
.modal {
  position: fixed;
  z-index: 30;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(134, 132, 245, 0.322);
}
.modal-content {
  background-color: rgba(253, 252, 252, 0.979);
  margin: 10% auto;
  padding: 30px;
  width: 100%;
  max-width: 500px;
  border-radius: 15px;
}
.close {
  float: right;
  font-size: 24px;
  cursor: pointer;
}
  </style>
</head>
<body> 

<h2>Gasto General</h2>

<div class="filtros">
  <input type="text" id="filtroTitulo" placeholder="Buscar por titulo">
  <select id="filtroCategoria">
    <option value="">Todas las categorias</option>
    
  </select>
  <input type="date" id="filtroFecha">
  <input type="number" id="filtroMontoExacto" placeholder="Monto exacto">
  <input type="number" id="filtroMin" placeholder="Monto mínimo">
  <input type="number" id="filtroMax" placeholder="Monto máximo">
  
  <select id="ordenarPor">
    <option value="">Ordenar por...</option>
    <option value="fecha">Fecha</option>
    <option value="monto">Monto</option>
  </select>
  <select id="filtroMes">
  <option value="">Todos los meses</option>
  
  <option value="0">Enero</option>
  <option value="1">Febrero</option>
  <option value="2">Marzo</option>
  <option value="3">Abril</option>
  <option value="4">Mayo</option>
  <option value="5">Junio</option>
  <option value="6">Julio</option>
  <option value="7">Agosto</option>
  <option value="8">Septiembre</option>
  <option value="9">Octubre</option>
  <option value="10">Noviembre</option>
  <option value="11">Diciembre</option>
</select>

  <button id="btnFiltro" onclick="aplicarFiltros()">Aplicar Filtros</button>
<button id="btnGuardar" style="display: none;" onclick="actualizarGasto()">Guardar cambios</button>
    <div id="mensajeError" style="display:none; color: white; background-color: red; padding: 10px; margin: 10px 0; border-radius: 5px;"></div>
   
  <!-- <button onclick="buscar()">Buscar</button> -->
<br><br>
   <a href="menu.html">Volver</a>
</div>


<table>
  <thead>
    <tr>
      <th>Titulo</th>
      <th>Categoria</th>
      <th>Monto</th>
      <th>Fecha</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody id="tablaGastos"></tbody>
</table>

<div id="modalEditar" class="modal" style="display:none;">

  <div class="modal-content">
     <!-- <div class="contentModal"><button class="btnModal" id="closeModal">x</button> -->
    <button class="close" onclick="cerrarModalEditar()">&times;</button>
    <h2>Editar Gasto</h2>
    <form id="loginForm">
    <form id="formEditarGasto">

      <!-- el modal de editar  en gasto general -->
      <input type="hidden" id="idEditar">

      <label for="tituloEditar">Titulo:</label>
      <input type="text" id="tituloEditar" required><br><br>
      <label for="categoriaEditar">Categorias:</label>
       <select id="categoriaEditar"> 

               <option disabled selected>Seleccionar una Categoria</option> 
            </select><br><br>
        
      <label for="montoEditar">Monto:</label>
      <input type="number" id="montoEditar" required><br><br>

      <label for="fechaEditar">Fecha:</label>
      <input type="date" id="fechaEditar" required><br><br>

      <center><button type="submit".style="display: none;">Guardar Cambios</button></center>
      </form>
    </form>
  </div>
</div>
</div>

<script src="gastoGeneral.js"></script>

<!-- <script src="gastoGeneral.js"></script> -->
  <script src="login.js"></script> 

</body>
</html>
