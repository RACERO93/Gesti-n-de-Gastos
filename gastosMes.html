<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Gastos por Mes</title>
  <style link rel="stylesheet" href="styles.css">
    body {

      font-family: Arial, sans-serif;
      padding: 0px;
      margin: 0 ! important;
      background: linear-gradient(180deg, rgba(251, 200, 251, 0) 34%, rgba(60, 220, 200, 1) 77%);
      position: relative;
    }

    h2 {
      text-align: center;
    }

    .meses {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px 0;
    }

    .meses button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #eee;
      cursor: pointer;
      transition: 0.3s;
    }

    .meses button.activo {
      background-color: #4CAF50;
      color: white;
    }

    .formulario,
    .filtros {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .formulario input,
    .formulario select,
    .filtros input,
    .filtros select {
      padding: 6px;
      width: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #f9f9f9;
    }

    .modal,
    .modalGastos {

      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      display: none;


    }

    .modal .overlay {

      width: 100%;
      height: 100%;
      background-color: rgba(13, 14, 14, 0.493);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modalGastos .overlay {
      border: 1px solid red;
      width: 100%;
      height: 100%;
      background-color: rgba(13, 14, 14, 0.493);
      display: flex;
      justify-content: center;
      align-items: center;
    }

      .modal .overlay .contentModal {
      width: 50%;
      height: 50%;
      border: solid red;
      background-color: rgb(243, 240, 240);
    }

    .modalGastos .overlay .contentGasto {
      width: 400px;
      height: auto;
      border: solid red;
      background-color: rgb(243, 240, 240);
      padding: 20px;
      border-radius: 10px;
    }


    .modalGastos .formulario {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 98%;
    }

    .modalGastos .formulario input,
    .modalGastos .formulario select,
    .modalGastos .formulario button {
      width: 100%;
      padding: 8px;
    }

    /* .modalGastos .overlay .contentGasto{
      width: 50%;
      height: 50%;
      border: solid red;
     background-color: rgb(243, 240, 240);
      
      
    } */

    .btnModal {
      float: right;
      border: none;
      color: white;
      background-color: red;
      width: 40px;
      height: 40px;
      font-size: 20px;
      font-weight: 700;
    }

    .btnGastos {
      float: right;
      border: none;
      color: white;
      background-color: red;
      width: 40px;
      height: 40px;
      font-size: 20px;
      font-weight: 700;
    }

    form {
      display: flex !important;
      justify-self: center;
      align-items: center;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      height: 100%;
      
    }

    form>button {
      width: 150px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background-color: darkcyan;
      color: #060606;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem;
    }


  </style>
</head>
