<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestion de Categorias</title>
  <style>
body {

      font-family: Arial, sans-serif;
      padding: 0px;
      margin: 0 ! important;
      background: linear-gradient(180deg, rgba(251, 200, 251, 0) 34%, rgba(60, 220, 200, 1) 77%);
      position: relative;
    }

    h1 {
      text-align: center;
    }

 
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
    }
 
    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
      position: relative;
    }
 
    .close {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 18px;
      cursor: pointer;
    }
 
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
 
    table, th, td {
      border: 1px solid #ccc;
    }
 
    th, td {
      padding: 8px;
      text-align: left;
    }
 
    button {
      margin-right: 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
 
    #mensajeCategoria {
      margin-top: 10px;
      font-weight: bold;
    }

     table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #f9f9f9;
    }
    .modal-borde{
        
      border-radius: 10px;
      padding: 20px;
      border: 1px solid red;
      
    }
    
  </style>
</head>
<body>

  <!-- Modal de Agregar Categorias y Editar Categorias -->
 <br><br><br>
  <center><img src="logo.png" width="80" height="100px" alt="JHJ"></center>
  <h1>Gestion de Categorias</h1>
  <button id="btnOpenModal">Agregar Categoria</button>
 <br><br><a href="gastosMes.html" style="float: right;">Volver</a>


  <!-- Modal de Agreagar Categoria  -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <div class="modal-borde">
      <button id="closeModalBtn" class="close">X</button>
      <h2 id="tituloModal">Agregar Categoria</h2>
      
      <input type="text" id="nuevaCategoria" placeholder="Nombre de la categoria" />
      <p id="mensajeCategoria"></p>
 
      <button id="btnAgregarCategoria">Agregar Categoria</button>
      <button id="btnGuardarCategoria" style="display: none;">Guardar Cambios</button>
    </div>
  </div>
  </div>
 
  <!-- Tabla -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tablaCategoria"></tbody>
  </table>
 
  <!-- Tu script JS debe ir después de todo el HTML -->
  <script src="categorias.js"></script>
 
</body>
</html>
